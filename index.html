.pv-doc.full{max-width:none;padding:0 72px 30vh}
.pv-head{padding-top:44px;position:relative}
.pv-head.has-banner{padding-top:16px}
.pv-head.has-icon.has-banner{padding-top:0}
.pv-icon{font-size:64px;line-height:1;width:84px;height:84px;display:grid;place-items:center;border-radius:8px;margin-left:-6px}
.pv-icon:hover{background:var(--hover)}
.pv-head.has-banner .pv-icon{margin-top:-42px;position:relative}
.pv-adds{display:flex;gap:4px;height:30px;align-items:center;opacity:0;transition:opacity .15s;margin:4px 0 2px -6px}
.pv-head:hover .pv-adds,.pv-adds:focus-within{opacity:1}
.pv-add{font-size:13px;color:var(--muted);padding:4px 7px;border-radius:5px}
.pv-add:hover{background:var(--hover);color:var(--text)}
.pv-title{font:700 38px/1.2 var(--serif);outline:none;padding:4px 0 10px;overflow-wrap:anywhere;cursor:text}
.pv-title:empty::before{content:attr(data-ph);color:var(--phc)}
.pv-props{display:flex;flex-direction:column;gap:1px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pp-row{display:flex;align-items:flex-start;gap:6px;min-height:32px}
.pp-name{width:170px;flex:none;display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);padding:5px 6px;border-radius:5px;text-align:left;min-width:0}
.pp-name:hover{background:var(--hover)}
.pp-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-ic{width:16px;flex:none;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.pp-val{flex:1;min-width:0;font-size:13.5px;display:flex;align-items:center;min-height:32px}
.pp-empty{color:var(--phc)}
.pp-tx{width:100%}
.pp-show{padding:5px 6px;border-radius:5px;cursor:text;min-height:28px;overflow-wrap:anywhere}
.pp-show:hover,.pp-opts:hover{background:var(--hover)}
.pp-show a{color:var(--link)}
.pp-in{width:100%;border:1px solid var(--sel);border-radius:5px;padding:4px 6px;font-size:13.5px;background:var(--card);outline:none}
.pp-opts{display:flex;flex-wrap:wrap;gap:4px;padding:5px 6px;border-radius:5px;text-align:left;min-height:28px;width:100%}
.pp-ro{padding:5px 6px;color:var(--muted)}
.pp-val .chk{margin:6px}
.pp-add{font-size:13px;color:var(--muted);padding:5px 6px;border-radius:5px;text-align:left;align-self:flex-start}
.pp-add:hover{background:var(--hover);color:var(--text)}
.pt-row{display:flex;gap:8px;align-items:center}
.pmenu{width:240px;padding:6px}
.pm-name{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;margin-bottom:4px;outline:none;background:var(--card)}
.pm-name:focus{border-color:var(--sel)}
.dd-item.danger,.mi.danger{color:#e04646}
.optpick{width:280px;padding:8px}
.op-g{font-size:11px;font-weight:700;color:var(--muted);padding:6px 6px 2px}
.op-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer}
.op-row:hover{background:var(--hover)}
.op-row.create{font-size:12.5px;color:var(--muted)}
.op-ck{width:14px;height:14px;color:var(--sel)}
.op-ck svg{width:14px;height:14px}
.op-more{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--muted);opacity:0}
.op-row:hover .op-more{opacity:1}
.op-more svg{width:14px;height:14px}
.op-colors{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:6px 0}
.op-sw{width:20px;height:20px;border-radius:4px;border:1px solid var(--line)}
.op-sw.cur{box-shadow:0 0 0 2px var(--sel)}
.op-sw.c-gray{background:var(--bg-gray)}.op-sw.c-brown{background:var(--bg-brown)}.op-sw.c-orange{background:var(--bg-orange)}.op-sw.c-yellow{background:var(--bg-yellow)}.op-sw.c-green{background:var(--bg-green)}.op-sw.c-blue{background:var(--bg-blue)}.op-sw.c-purple{background:var(--bg-purple)}.op-sw.c-pink{background:var(--bg-pink)}.op-sw.c-red{background:var(--bg-red)}
.datepick{padding:10px;width:230px}
.dp-row{display:flex;gap:6px;margin:4px 0;align-items:center}
.dp-row .tm-input{width:100%}
.emopop{width:312px;padding:8px}
.emo-top{display:flex;gap:6px;margin-bottom:6px}
.emo-top .rp-q{margin:0;flex:1}
.emo-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-height:220px;overflow:auto}
.emo{font-size:20px;line-height:1;height:32px;border-radius:5px}
.emo:hover{background:var(--hover)}
.coverpop{width:330px;padding:10px}
.cover-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.cover-sw{height:38px;border-radius:5px}
.cover-sw:hover{outline:2px solid var(--sel)}
.cover-row{display:flex;gap:6px;margin:4px 0 8px}
.pv-bl{margin:2px 0 8px}
.pv-bl-h{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);padding:3px 4px;border-radius:5px}
.pv-bl-h:hover{background:var(--hover)}
.pv-bl-it{display:block;font-size:13px;padding:3px 8px 3px 26px;border-radius:5px;text-align:left;color:var(--text)}
.pv-bl-it:hover{background:var(--hover)}
.tpl-box{margin:18px 0;padding:14px 0;border-top:1px dashed var(--line)}
.tpl-h{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.tpl-row{display:flex;flex-wrap:wrap;gap:8px}
.tpl{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);font-size:13px;background:var(--card)}
.tpl:hover{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 6%,var(--card))}
.tpl.mine{border-style:dashed}
.tpl-ic{font-size:16px}
.tpl-x{margin-left:4px;color:var(--muted);font-size:13px;padding:0 3px;border-radius:3px}
.tpl-x:hover{background:var(--hover);color:#e04646}
/* ===== blocks ===== */
.pv-body{padding:4px 0 40px;min-height:120px}
.blk{position:relative;display:flex;align-items:flex-start;margin:1px 0;border-radius:4px}
.blk.dragging{opacity:.35}
.bh{position:absolute;left:-50px;top:2px;display:flex;gap:1px;opacity:0;transition:opacity .1s}
.blk:hover>.bh,.bh:focus-within{opacity:1}
.bh button{width:22px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.bh button:hover{background:var(--hover)}
.bh svg{width:15px;height:15px}
.bh-drag{cursor:grab}
.bc{flex:1;min-width:0;display:flex;align-items:flex-start;gap:4px;padding:3px 2px}
.bt{flex:1;min-width:0;outline:none;font-size:var(--page-fs,16px);line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;cursor:text}
.bt.is-empty::before{content:attr(data-ph);color:var(--phc);pointer-events:none}
.b-text .bt.is-empty:not(:focus)::before{content:none}
.pv-body>.b-text:only-child .bt.is-empty::before{content:"Start writing, or type '/' for commands";}
.b-h1 .bt{font:700 30px/1.3 var(--serif);margin-top:18px}
.b-h2 .bt{font:700 23px/1.3 var(--serif);margin-top:14px}
.b-h3 .bt{font:600 19px/1.35 var(--serif);margin-top:10px}
.b-h1>.bh{top:24px}.b-h2>.bh{top:18px}.b-h3>.bh{top:12px}
.bm{width:22px;flex:none;text-align:center;font-size:16px;line-height:1.6;color:var(--text);user-select:none}
.b-number .bm{width:26px;text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
.bchk{width:18px;height:18px;margin:4px 4px 0 2px;flex:none;border:1.6px solid var(--muted);border-radius:3px;display:grid;place-items:center;color:#fff}
.bchk.on{background:var(--sel);border-color:var(--sel)}
.bchk svg{width:12px;height:12px}
.b-todo.checked .bt{color:var(--muted);text-decoration:line-through}
.btog{width:22px;height:22px;margin-top:2px;flex:none;display:grid;place-items:center;border-radius:4px;color:var(--text)}
.btog:hover{background:var(--hover)}
.btog svg{width:12px;height:12px;transition:transform .15s}
.b-toggle.open .btog svg{transform:rotate(90deg)}
.b-quote .bc{border-left:3px solid currentColor;padding-left:14px;margin:4px 0}
.b-quote .bt{font-size:17px}
.b-callout .bc{background:var(--bg-gray);border-radius:6px;padding:14px 16px 14px 12px;margin:4px 0;gap:10px}
.bemo{font-size:20px;line-height:1.3;width:28px;height:28px;flex:none;border-radius:5px}
.bemo:hover{background:var(--hover)}
.b-divider .bc{padding:10px 2px}
.b-divider hr{width:100%;border:0;border-top:1px solid var(--line);margin:0}
.b-code .bc{flex-direction:column;gap:0;background:var(--hover);border-radius:6px;padding:8px 14px 12px;margin:4px 0}
.bcode-lab{font-size:11px;color:var(--muted);margin-bottom:4px;user-select:none}
.bcode{margin:0;width:100%;outline:none;font:13.5px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}
.bimg{margin:6px 0;width:100%}
.bimg.w-md{width:66%}.bimg.w-sm{width:40%}
.bimg img{width:100%;display:block;border-radius:6px}
.bcap{font-size:13px;color:var(--muted);padding:6px 2px 0;outline:none;min-height:1.4em}
.bcap.is-empty:not(:focus)::before{content:none}
.bcap.is-empty::before{content:attr(data-ph);color:var(--phc)}
.bph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;background:var(--hover);border-radius:6px;padding:12px 14px;color:var(--muted);font-size:14px;margin:4px 0}
.bph-ic{width:20px;height:20px}.bph-ic svg{width:20px;height:20px}
.bph-c{display:flex;gap:6px;flex:1;min-width:220px;justify-content:flex-end;flex-wrap:wrap}
.bph-in{flex:1;min-width:200px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:13px;background:var(--card);outline:none}
.bph-in:focus{border-color:var(--sel)}
.bfile{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:6px;background:var(--hover);cursor:pointer;font-size:14px;margin:3px 0}
.bfile:hover{background:color-mix(in srgb,var(--sel) 14%,transparent)}
.bfile-ic svg{width:16px;height:16px;display:block}
.bfile-s{font-size:12px;color:var(--muted)}
.b-video .bc,.b-bookmark .bc,.b-image .bc{flex-direction:column;gap:4px}
.bvid{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;margin:4px 0}
.bvid iframe,.bvid video{width:100%;height:100%;border:0;display:block}
.bvid.file{aspect-ratio:auto}.bvid.file video{height:auto;max-height:70vh}
.bvid-t{font-size:12.5px;color:var(--muted)}.bvid-t a{color:inherit}
.bbm{display:flex;width:100%;border:1px solid var(--line);border-radius:7px;overflow:hidden;text-decoration:none;color:var(--text);margin:4px 0;min-height:96px}
.bbm:hover{background:var(--hover)}
.bbm-t{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.bbm-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbm-d{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bbm-u{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:auto}
.bbm-u img{width:14px;height:14px}
.bbm-img{width:32%;max-width:240px;background-size:cover;background-position:center;flex:none}
.bsub,.blink{display:inline-flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:5px;cursor:pointer;font-size:16px;line-height:1.5;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;font-weight:600}
.bsub:hover,.blink:hover{background:var(--hover)}
.bsub-ic{width:22px;text-align:center;font-size:18px;color:var(--muted);text-decoration:none}
.bsub-ic svg{width:18px;height:18px;display:block;margin:auto}
.blink-ic{color:var(--muted);width:22px;text-align:center}
.btoc{display:flex;flex-direction:column;gap:1px;width:100%;padding:4px 0}
.btoc a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;padding:3px 6px;border-radius:4px;font-size:14px}
.btoc a:hover{background:var(--hover);color:var(--text)}
.btoc .toc-h2{padding-left:24px}.btoc .toc-h3{padding-left:44px}
.bcols{display:grid;gap:24px;width:100%}
.bcols.n2{grid-template-columns:1fr 1fr}.bcols.n3{grid-template-columns:1fr 1fr 1fr}
.bcolc{min-width:0}
.bcolc .bh{left:-46px}
.b-cols>.bc{padding:0}
.blk.flash-b{animation:flashb 1.2s ease}
@keyframes flashb{0%,50%{background:color-mix(in srgb,var(--sel) 16%,transparent)}100%{background:transparent}}
.blk-ind{position:fixed;background:var(--sel);border-radius:2px;z-index:30500;pointer-events:none;display:none}
.blk-ghost{position:fixed;z-index:30600;pointer-events:none;background:var(--menu);box-shadow:var(--shadow-lg);border-radius:6px;padding:5px 10px;font-size:13px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
/* block colors */
.bc-gray .bc{color:var(--tc-gray)}.bc-brown .bc{color:var(--tc-brown)}.bc-orange .bc{color:var(--tc-orange)}.bc-yellow .bc{color:var(--tc-yellow)}.bc-green .bc{color:var(--tc-green)}.bc-blue .bc{color:var(--tc-blue)}.bc-purple .bc{color:var(--tc-purple)}.bc-pink .bc{color:var(--tc-pink)}.bc-red .bc{color:var(--tc-red)}
.bc-bg-gray>.bc{background:var(--bg-gray);border-radius:5px}.bc-bg-brown>.bc{background:var(--bg-brown);border-radius:5px}.bc-bg-orange>.bc{background:var(--bg-orange);border-radius:5px}.bc-bg-yellow>.bc{background:var(--bg-yellow);border-radius:5px}.bc-bg-green>.bc{background:var(--bg-green);border-radius:5px}.bc-bg-blue>.bc{background:var(--bg-blue);border-radius:5px}.bc-bg-purple>.bc{background:var(--bg-purple);border-radius:5px}.bc-bg-pink>.bc{background:var(--bg-pink);border-radius:5px}.bc-bg-red>.bc{background:var(--bg-red);border-radius:5px}
.bt code{font-family:var(--mono);font-size:.86em;background:var(--hover);color:#eb5757;padding:1px 4px;border-radius:3px}
.bt a{color:inherit;text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.mention{display:inline;padding:0 3px;border-radius:4px;font-weight:600;cursor:pointer;text-decoration:none!important;white-space:nowrap}
a.mention{color:var(--text);border-bottom:1px solid var(--line)}
a.mention:hover{background:var(--hover)}
.mdate{color:var(--muted);font-weight:500}
.mdate::before{content:"@";opacity:.7}
/* slash menu & format bar */
.slashmenu{position:fixed;z-index:31000;width:300px;max-height:340px;overflow:auto;background:var(--menu);border-radius:8px;box-shadow:var(--shadow-lg);padding:6px}
.sl-it{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:5px;cursor:pointer}
.sl-it.cur,.sl-it:hover{background:var(--hover)}
.sl-ic{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;background:var(--card);font-size:14px;font-weight:700;color:var(--muted)}
.sl-l{font-size:14px}.sl-d{font-size:11.5px;color:var(--muted)}
.sl-none{padding:8px;color:var(--muted);font-size:13px}
.fmtbar{position:fixed;z-index:31000;display:flex;align-items:center;gap:1px;background:var(--menu);border-radius:7px;box-shadow:var(--shadow-lg);padding:3px}
.fb{min-width:30px;height:30px;padding:0 7px;border-radius:5px;font-size:13.5px;color:var(--text)}
.fb:hover{background:var(--hover)}
.fb.mono{font-family:var(--mono);font-size:12px}
.fb-hl{background:rgba(255,212,0,.5);padding:0 4px;border-radius:2px}
.fb-a{text-decoration:underline;text-decoration-color:var(--tc-orange);text-decoration-thickness:2px}
.fb-link{width:280px;border:0;outline:none;padding:6px 8px;background:transparent;font-size:13px}
@media (max-width:700px){
  .pv-wrap{left:0}
  .pv-doc,.pv-doc.full{padding:0 22px 40vh}
  .pv-title{font-size:30px}
  .bh{left:-30px}.bh .bh-add{display:none}
  .pp-name{width:120px}
  .bcols.n2,.bcols.n3{grid-template-columns:1fr}
  .pv-edited{display:none}
}
@media (hover:none){.bh{opacity:.45}}
@media print{
  body.print-page #app,body.print-page #toast,body.print-page #focusMini,body.print-page .fmtbar{display:none!important}
  body.print-page .pv-wrap{position:static!important;display:block}
  body.print-page .pv-back,body.print-page .pv-top,body.print-page .pv-adds,body.print-page .bh,body.print-page .tpl-box,body.print-page .pp-add,body.print-page .pv-bn-acts{display:none!important}
  body.print-page .pv{position:static!important;width:auto!important;height:auto!important;box-shadow:none!important;overflow:visible!important}
  body.print-page .pv-scroll{overflow:visible}
  body.print-page,body.print-page html{overflow:visible!important;height:auto!important}
  body.print-page .pv-doc{padding-bottom:0}
}
#topbar .crumbs{flex:1}
/* ===== round 5: databases ===== */
.card.t-database{display:flex;flex-direction:column;border-radius:8px}
.dbv{display:flex;flex-direction:column;min-height:0;width:100%;font-size:13.5px;color:var(--text)}
.dbv.m-card{flex:1;height:100%}
.dbv.m-block{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--card)}
.dbv.m-full{flex:1}
.dbv-msg{padding:18px;color:var(--muted);font-size:13px}
.dbv-head{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;flex:none}
.dbv.m-card .dbv-head{cursor:grab}
.dbv-icon{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:6px;font-size:19px;line-height:1;color:var(--muted)}
.dbv-icon:hover{background:var(--hover)}
.dbv-icon svg{width:19px;height:19px}
.dbv-title{flex:1;min-width:0;font:700 17px/1.3 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbv-title.ed{outline:none;cursor:text;white-space:normal}
.dbv-title.ed:empty::before{content:attr(data-ph);color:var(--phc)}
.dbv.m-full .dbv-title{font-size:28px}
.dbv.m-full .dbv-head{padding:22px 28px 6px}
.dbv.m-full .dbv-bar,.dbv.m-full .dbv-chips{padding-left:28px;padding-right:28px}
.dbv.m-full .dbv-scroll{padding:0 28px 80px}
.dbv-linked{font-size:11px;font-weight:600;color:var(--sel);background:color-mix(in srgb,var(--sel) 12%,transparent);padding:2px 8px;border-radius:10px;white-space:nowrap;flex:none}
.dbv-count{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none}
.dbv-exp svg{width:15px;height:15px}
.dbv-bar{display:flex;align-items:center;gap:8px;padding:2px 12px 6px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.dbv-tabs{display:flex;gap:2px;flex:1;min-width:0;flex-wrap:wrap}
.dbv-tab{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:4px 9px;border-radius:6px;color:var(--muted);white-space:nowrap}
.dbv-tab:hover{background:var(--hover)}
.dbv-tab.cur{color:var(--text);font-weight:600;background:var(--hover)}
.dbv-vic{font-size:12px;opacity:.8}
.dbv-acts{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.dbv-btn{font-size:12.5px;padding:4px 8px;border-radius:6px;color:var(--muted);white-space:nowrap}
.dbv-btn:hover{background:var(--hover);color:var(--text)}
.dbv-btn.on{color:var(--sel);font-weight:600}
.dbv-btn.primary{background:var(--sel);color:#fff;font-weight:600;margin-left:4px}
.dbv-btn.primary:hover{filter:brightness(1.08);color:#fff}
.dbv-chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px;flex:none}
.dbv-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 4px 2px 9px;border-radius:12px;background:color-mix(in srgb,var(--sel) 10%,transparent);color:var(--sel)}
.dbv-chip.sort{background:var(--hover);color:var(--text)}
.dbv-chip button{width:16px;height:16px;border-radius:50%;font-size:13px;line-height:1;color:inherit;opacity:.7}
.dbv-chip button:hover{opacity:1;background:var(--hover)}
.dbv-scroll{flex:1;min-height:0;overflow:auto;position:relative}
.dbv.m-block .dbv-scroll{max-height:560px}

/* table */
.dbt{border-collapse:collapse;table-layout:fixed;font-size:13.5px}

.dbt-hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbt th{position:sticky}
.dbt-rz{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}

.dbt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow:hidden;position:relative;height:33px;line-height:1.5}

.dbt-c.t-multi,.dbt-c.t-relation{white-space:normal}

.dbt-in{width:100%;height:32px;border:0;outline:none;background:var(--card);padding:5px 8px;font:inherit;color:inherit}
.dbt-ric{margin-right:5px}
.dbt-open{position:absolute;right:6px;top:6px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 6px;opacity:0;box-shadow:var(--shadow)}
.dbt-c:hover .dbt-open{opacity:1}

.dbt-link{color:var(--link);text-decoration:underline}
.dbt-err{color:var(--v-crit);font-size:12px}
.dbck{display:inline-grid;place-items:center;width:16px;height:16px;border:1.6px solid var(--muted);border-radius:3px;color:#fff;vertical-align:-3px}
.dbck.on{background:var(--sel);border-color:var(--sel)}
.dbck svg{width:11px;height:11px}
.relpill{display:inline-block;font-size:12.5px;padding:0 7px;border-radius:4px;background:var(--hover);cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.relpill:hover{background:color-mix(in srgb,var(--sel) 14%,transparent)}
.dbt-g td{background:color-mix(in srgb,var(--text) 3%,transparent);padding:7px 8px;border-right:0}
.dbt-gn{font-size:12px;color:var(--muted);margin-left:8px}
.dbt-gadd{margin-left:8px;width:20px;height:20px;border-radius:4px;color:var(--muted)}
.dbt-gadd:hover{background:var(--hover)}
.dbt-new td{color:var(--muted);cursor:pointer;border-right:0}
.dbt-new td:hover{background:var(--hover);color:var(--text)}
.dbt tfoot td{border:0;padding:0;height:30px}
.dbt-calc{width:100%;height:30px;text-align:right;padding:0 8px;font-size:12.5px;color:var(--muted);opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbt-calc.on{opacity:1;color:var(--text);font-weight:600}
.dbt tfoot:hover .dbt-calc{opacity:1}
.dbt-calc:hover{background:var(--hover)}
.dbt-cl{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
/* board */
.dbb{display:flex;gap:10px;align-items:stretch;min-height:100%;padding:12px;min-width:min-content}
.dbb-col{width:250px;flex:none;background:color-mix(in srgb,var(--text) 4%,transparent);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}

.dbb-h{display:flex;align-items:center;padding:2px 2px 4px}
.dbb-card,.dbg-card{background:var(--card);border-radius:6px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;text-align:left;color:var(--text)}
.dbb-card{padding:9px 10px;touch-action:none;user-select:none}

.dbb-card.dragging{opacity:.35}
.dbb-cover{height:70px;margin:-9px -10px 8px;background-size:cover;background-position:center}
.dbb-t{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}

/* gallery */
.dbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:12px}

/* list */
.dbl{padding:6px 8px;display:flex;flex-direction:column}

.dbl-chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;justify-content:flex-end;max-width:60%}

/* popovers */

.dbp-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dbp-sp{flex:1}

.fxpop{width:400px;max-width:96vw;padding:10px}
.fx-ta{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;font:13px/1.5 var(--mono);background:var(--card);color:var(--text);outline:none;resize:vertical}
.fx-ta:focus{border-color:var(--sel)}
.fx-out{font-size:12.5px;color:var(--muted);margin:6px 0;min-height:18px;overflow-wrap:anywhere}

.fx-chips{display:flex;flex-wrap:wrap;gap:4px}
.fx-chip{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--hover)}
.fx-chip.fn{font-family:var(--mono);font-size:11.5px}

.cfm{max-width:440px}.cfm p{line-height:1.5;margin:0 0 6px}
/* full page + row side peek */
.dbfull{position:fixed;top:0;bottom:0;right:0;left:var(--sbw,0px);z-index:23000;background:var(--card);display:flex;flex-direction:column}
.dbfull-body{flex:1;min-height:0;display:flex;flex-direction:column}
.pv-wrap.rside{justify-content:flex-end;align-items:stretch}

.pv-wrap.rside .pv-banner{height:160px}
@media (max-width:700px){.dbfull{left:0}.dbv.m-full .dbv-head{padding:14px 14px 4px}.dbv.m-full .dbv-bar,.dbv.m-full .dbv-chips{padding-left:14px;padding-right:14px}.dbv.m-full .dbv-scroll{padding:0 14px 90px}.dbpop.wide{min-width:0}.dbv.m-full .dbv-title{font-size:22px}}

.dbv-tabs{flex:1 1 auto;min-width:min(100%,150px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}

.dbv-tab,.dbv-btn{flex:none}

.set-modal{max-width:720px!important;width:720px;height:480px;padding:0!important;overflow:hidden!important}

.al-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}.al-grid.two{grid-template-columns:1fr 1fr}

const DB = {
  db: null, ok: false,
  open() {
    return new Promise(res => {

        r.onerror = () => res(false);
        r.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!DB.ok) return res(undefined);
      try { const t = DB.db.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }
      catch (e) { rej(e); }
    });
  },
  get: (s, k) => DB.req(s, 'readonly', o => o.get(k)),
  put: (s, k, v) => DB.req(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.req(s, 'readwrite', o => o.delete(k)),
  keys: s => DB.req(s, 'readonly', o => o.getAllKeys()),
};

function openTaskPool() { const out = []; for (const c of allLists()) for (const it of c.data.items) { normTask(it); if (!it.done) out.push({ it, c }); } return out; }

  const t = todayStr(), A = a.it, B = b.it;

}
function top3() {

  const rest = pool.filter(x => !pinned.includes(x)).sort(autoRank);

}
function autoWhy(it) {

  if (it.due === t) return 'Due today';
  if (it.due) return 'Due ' + fmtDue(it.due).replace(/^(Tomorrow|Yesterday)$/, m => m.toLowerCase());
  if (it.urgent) return 'Urgent'; if (it.important) return 'Important';

}
