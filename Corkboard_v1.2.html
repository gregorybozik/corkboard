<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Corkboard</title>
<style id="appstyle">.app-root{
  --canvas:#ebeced; --dot:#c4c7ca; --card:#ffffff; --text:#2b2d30; --muted:#8b9096; --line:#e1e3e6;
  --bar:#ffffff; --bar-text:#3a3d41; --tb:#ebeced; --hover:rgba(0,0,0,.05); --sel:#3d7cf5; --accent:#e0703a;
  --menu:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.09),0 0 0 1px rgba(0,0,0,.035);
  --shadow-lg:0 8px 28px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --phc:#b9bdc2; --colbody:#f1f2f3; --link:#d0602d;
  font-family:var(--sans); color:var(--text);
}
.app-root.dark{
  --canvas:#1d1e20; --dot:#3a3c40; --card:#2a2c2f; --text:#e7e8ea; --muted:#9aa0a7; --line:#393b3f;
  --bar:#232427; --bar-text:#d9dbde; --tb:#1d1e20; --hover:rgba(255,255,255,.07); --menu:#2c2e31;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
  --phc:#62666c; --colbody:#232527; --link:#f08a52;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--canvas);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* top bar */
#topbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--bar);color:var(--bar-text);font-size:13px;flex:none;gap:10px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.logo{width:18px;height:18px;border-radius:50%;background:var(--text);color:var(--bar);display:grid;place-items:center;font:700 10px var(--sans);flex:none}
.crumb{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:4px;cursor:pointer;min-width:0}
.crumb:hover{background:var(--hover)}
.crumb .ci{width:14px;height:14px;border-radius:3px;flex:none;display:grid;place-items:center;font-size:9px}
.crumb span{overflow:hidden;text-overflow:ellipsis}
.crumb-sep{color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:2px;flex:none}
.ib{width:30px;height:28px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--text)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib svg{width:18px;height:18px}
.ib.on{color:var(--sel)}

#titlebar{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
#boardTitle{margin:0;font:600 19px var(--serif);text-align:center;padding:2px 8px;border-radius:4px;outline:none;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
#boardTitle:hover{background:var(--hover)}
.title-actions{justify-self:end;display:flex;gap:4px}
.tbtn{display:flex;align-items:center;gap:4px;font-size:13px;padding:5px 8px;border-radius:5px;color:var(--bar-text)}
.tbtn:hover{background:var(--hover)}
.tbtn svg{width:12px;height:12px}
.tbtn .ic-m{display:none}
.tbtn .ic-m svg{width:18px;height:18px}

#main{flex:1;display:flex;min-height:0;position:relative}
/* left toolbar */
#toolbar{width:62px;flex:none;background:var(--tb);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow-y:auto;overflow-x:hidden;z-index:30;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tool{width:58px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:6px;color:var(--text);font-size:10px;line-height:1.1;user-select:none;-webkit-user-select:none;touch-action:none;flex:none;text-align:center}
.tool:hover{background:var(--hover)}
.tool.active{background:var(--hover);box-shadow:inset 0 0 0 1.5px var(--sel)}
.tool .ti{width:28px;height:28px;display:grid;place-items:center;border-radius:5px}
.tool .ti svg{width:22px;height:22px}
.tool .ti.boxed{background:var(--card);box-shadow:var(--shadow)}
.tool .ti.blue{background:#4c7cf0;color:#fff}
.tool .ti.blue svg{width:18px;height:18px}
.tool .sw{width:22px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.15);position:relative;overflow:hidden;background:var(--card)}
.tool .sw.none::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#e04646;transform:rotate(-45deg)}
.tb-sep{width:30px;height:1px;background:var(--line);margin:6px 0;flex:none}
.tb-spacer{flex:1;min-height:10px}
.tb-back{width:40px;height:22px;display:grid;place-items:center;color:var(--muted);border-radius:4px;flex:none}
.tb-back:hover{background:var(--hover)}
.tb-back svg{width:14px;height:14px}
.more-dots{width:30px;height:16px;border-radius:4px;display:grid;place-items:center;background:var(--hover)}
.tool-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.85;width:120px;height:70px;background:var(--card);box-shadow:var(--shadow-lg);display:grid;place-items:center;font-size:12px;color:var(--muted);transform:translate(-50%,-50%)}

/* viewport */
#viewport{outline:none;flex:1;position:relative;overflow:hidden;touch-action:none;background-color:var(--canvas);
  background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.3px);background-size:20px 20px}
#viewport.nogrid{background-image:none}
#viewport.tool-line,#viewport.tool-draw{cursor:crosshair}
#viewport.panning{cursor:grabbing}
#viewport.space{cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#cards{position:absolute;left:0;top:0}
#lines,#inklayer{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#lines{z-index:100000}
#inklayer{z-index:100001}
#lines .hit{pointer-events:stroke;cursor:pointer}
#lines .lh{pointer-events:all;cursor:move}
#marquee{position:absolute;border:1px solid var(--sel);background:rgba(61,124,245,.08);display:none;pointer-events:none;z-index:5}
#unsortedBadge{position:absolute;right:14px;top:12px;z-index:20;font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
#unsortedBadge b{color:var(--text)}
#unsortedBadge:hover{color:var(--text)}
.emptyhint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:14px;pointer-events:none;z-index:1;line-height:1.6}
.emptyhint b{display:block;font:600 20px var(--serif);color:var(--text);margin-bottom:6px}

/* cards */
.card{position:absolute;background:var(--card);box-shadow:var(--shadow);border-radius:2px;font-size:14px;line-height:1.55;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--text)}
.card.selected{outline:2px solid var(--sel);outline-offset:1px}
.card.editing{outline:2px solid var(--sel)}
.card.drop-target{outline:2px dashed var(--sel)}
.card.colored{background:color-mix(in srgb,var(--cc) 30%,var(--card))}
.card.colored.dark-color{background:var(--cc);color:#fff}
.card.colored.dark-color .muted,.card.colored.dark-color .board-count{color:rgba(255,255,255,.75)}
.card.dragging{box-shadow:var(--shadow-lg);opacity:.96}
.card [contenteditable="true"],.card [contenteditable="plaintext-only"]{user-select:text;-webkit-user-select:text;outline:none;cursor:text}
[data-ph]:empty::before{content:attr(data-ph);color:var(--phc);pointer-events:none}
.resize{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;cursor:nwse-resize;display:none;z-index:3}
.resize::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-right:2px solid var(--sel);border-bottom:2px solid var(--sel)}
.card.selected>.resize{display:block}
.lock-ind{position:absolute;right:4px;top:4px;width:16px;height:16px;color:var(--muted);opacity:.7}
.lock-ind svg{width:14px;height:14px}
.labels{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 0}
.label{font-size:10.5px;font-weight:600;color:#fff;padding:1px 7px;border-radius:9px;line-height:1.6}
.reacts{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px}
.react{font-size:12px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.caption{padding:8px 14px 10px;font-size:12.5px;color:var(--muted);min-height:1em}
.cmt-badge{position:absolute;right:-10px;top:-10px;display:flex;align-items:center;gap:3px;background:var(--sel);color:#fff;font-size:10px;font-weight:600;padding:2px 6px 2px 4px;border-radius:10px;z-index:4}
.cmt-badge svg{width:12px;height:12px}

.rt h1{font:600 22px/1.3 var(--serif);margin:.2em 0 .35em}
.rt h2{font:600 17px/1.35 var(--serif);margin:.2em 0 .3em}
.rt p,.rt div{margin:0}
.rt ul,.rt ol{margin:.2em 0;padding-left:1.4em}
.rt blockquote{margin:.3em 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.rt pre,.rt code{font-family:var(--mono);font-size:12.5px;background:var(--hover);border-radius:3px}
.rt pre{padding:8px 10px;white-space:pre-wrap;margin:.3em 0}
.rt code{padding:1px 4px}
.rt a{color:var(--link)}
.rt mark{background:#fff3a0;color:inherit;padding:0 1px}
.dark .rt mark{background:#6b5d12}
.note-body{padding:14px 18px;min-height:52px;word-wrap:break-word;overflow-wrap:anywhere}

/* link */
.link-empty{display:flex;align-items:center;gap:8px;padding:12px 14px;color:var(--muted)}
.link-empty svg{width:18px;height:18px;flex:none}
.link-empty input,.inline-input{flex:1;border:0;outline:0;background:transparent;font-size:13.5px;min-width:0}
.link-img{display:block;background:#202124;overflow:hidden}
.link-img img{width:100%;display:block;max-height:420px;object-fit:cover}
.link-body{padding:12px 16px 14px}
.link-url{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
.link-url img,.link-url svg{width:13px;height:13px;flex:none;border-radius:2px}
.link-url span{overflow:hidden;text-overflow:ellipsis}
.link-title{display:block;margin-top:6px;font-weight:600;color:var(--link);text-decoration:underline;cursor:pointer;word-break:break-word}
.link-desc{margin-top:8px;font-size:12.5px;line-height:1.6;word-break:break-word}

/* todo */
.todo{padding:14px 18px 12px}
.todo-title{font:600 15px var(--serif);margin-bottom:8px;min-height:1.2em}
.todo-item{display:flex;align-items:flex-start;gap:9px;padding:2px 0}
.chk{width:14px;height:14px;margin-top:4px;flex:none;border:1.5px solid var(--muted);border-radius:2px;display:grid;place-items:center;color:#fff}
.chk svg{width:10px;height:10px}
.todo-item.done .chk{background:var(--sel);border-color:var(--sel)}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-text{flex:1;min-height:1.4em;word-break:break-word}
.todo-text.ph{color:var(--phc);cursor:text}
.chk.ghost{opacity:.5}

/* board tile */
.card.t-board{background:transparent!important;box-shadow:none}
.card.t-board.selected{outline-offset:3px}
.board-tile{display:flex;flex-direction:column;align-items:center;padding:4px 2px;text-align:center}
.board-icon{width:72px;height:72px;border-radius:4px;display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow);cursor:pointer;color:#fff}
.board-name{margin-top:7px;font-size:13px;font-weight:600;line-height:1.3;word-break:break-word;min-width:20px}
.board-count{font-size:11px;color:var(--muted)}

/* column */
.col-head{padding:14px 12px 8px;text-align:center}
.card.colored .col-head{background:color-mix(in srgb,var(--cc) 45%,var(--card))}
.card.t-column.colored{background:var(--card)}
.col-title{font:600 16px var(--serif);min-height:1.3em}
.col-count{font-size:11px;color:var(--muted)}
.col-body{padding:6px;display:flex;flex-direction:column;gap:6px;min-height:56px}
.col-body.empty{margin:6px;background:var(--colbody);min-height:54px}
.col-body .card{position:relative;left:auto!important;top:auto!important;width:auto!important;z-index:auto!important}
.col-drop{height:4px;background:var(--sel);border-radius:2px;margin:-5px 0}

/* comment */
.cmt{padding:10px 12px}
.msg{display:flex;gap:8px;padding:4px 0 8px}
.msg .mt{flex:1;min-width:0}
.msg .mh{font-size:11px;color:var(--muted)}
.msg .mh b{color:var(--text);font-weight:600;margin-right:4px}
.msg .mx{font-size:13px;word-break:break-word;white-space:pre-wrap}
.msg .del{opacity:0;color:var(--muted);font-size:14px;width:16px}
.msg:hover .del{opacity:1}
.avatar{width:24px;height:24px;border-radius:50%;background:#7a8696;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.cmt-compose{display:flex;align-items:center;gap:8px}
.cmt-compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 8px;font-size:12.5px;outline:none}
.cmt-compose button{font-size:12px;color:var(--sel);font-weight:600;padding:4px}

/* table */
.tbl-wrap{padding:10px;overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}
.tbl td,.tbl th{border:1px solid var(--line);padding:5px 7px;height:30px;vertical-align:top;min-height:1.5em;word-break:break-word;text-align:left}
.tbl th{background:var(--hover);font-weight:600}
.tbl td.cur,.tbl th.cur{box-shadow:inset 0 0 0 2px var(--sel)}

/* sketch, ink */
.sketch-area{width:100%;height:100%;background:var(--card);position:relative}
.card.t-sketch{overflow:hidden}
.sketch-area svg,.ink-svg{width:100%;height:100%}
.card.sketching{outline:2px solid #e0703a;cursor:crosshair}
.card.t-ink{background:transparent!important;box-shadow:none}
.card.t-ink svg{width:100%;height:auto}

/* swatch */
.swatch-color{height:110px}
.swatch-info{padding:8px 12px 10px}
.swatch-hex{font:600 13px var(--mono)}
.swatch-rgb{font-size:11px;color:var(--muted)}

/* document */
.doc-tile{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.doc-icon{width:30px;height:36px;color:var(--sel)}
.doc-icon svg{width:30px;height:36px}
.doc-title{font:600 15px var(--serif);line-height:1.3}
.doc-snip{font-size:12px;color:var(--muted);max-height:4.6em;overflow:hidden}
.doc-open{align-self:flex-start;font-size:12px;color:var(--sel);font-weight:600}

/* media */
.upload-prompt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:26px 14px;color:var(--muted);font-size:13px;cursor:pointer;text-align:center;border:1.5px dashed var(--line);margin:8px;height:calc(100% - 16px);min-height:110px}
.upload-prompt svg{width:24px;height:24px}
.upload-prompt .small{font-size:11px}
.upload-prompt:hover{color:var(--text)}
.img-wrap{position:relative}
.img-wrap img{width:100%;display:block;pointer-events:none}
.img-ann{position:absolute;inset:0;width:100%;height:100%}
.card.t-image.nobg{background:transparent!important;box-shadow:none}
.card.t-image.colored{background:var(--card);border:5px solid var(--cc)}
.media-file{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mf-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;word-break:break-all}
.mf-name svg{width:18px;height:18px;flex:none}
.media-file audio{width:100%;height:36px}
.card video{width:100%;display:block;background:#000}
.video-wrap,.map-wrap{position:relative;width:100%}
.video-wrap{aspect-ratio:16/9}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card:not(.selected) .map-wrap iframe{pointer-events:none}
body.ptr-busy iframe,body.ptr-busy video{pointer-events:none!important}
.video-bar{cursor:grab}
.video-bar .vbtn,.video-bar input{cursor:pointer}
.video-empty,.map-empty{display:flex;flex-direction:column;gap:10px;padding:16px;color:var(--muted);font-size:13px}
.video-empty input,.map-empty input{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:7px 9px;outline:none;font-size:13px}
.btn{font-size:12.5px;padding:6px 11px;border-radius:4px;background:var(--hover);color:var(--text);font-weight:600}
.btn:hover{background:color-mix(in srgb,var(--sel) 15%,transparent)}
.btn.primary{background:var(--sel);color:#fff}
.btn.danger{background:#e04646;color:#fff}
.card.t-map{display:flex;flex-direction:column;overflow:hidden}
.map-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.map-wrap iframe{flex:1;width:100%;border:0;min-height:0}
.map-label{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;font-size:12px;border-top:1px solid var(--line)}
.map-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-label a{color:var(--sel);flex:none}
.file-tile{display:flex;align-items:center;gap:12px;padding:12px 14px}
.file-ext{width:38px;height:46px;border-radius:3px;background:var(--sel);color:#fff;display:grid;place-items:center;font:700 10px var(--sans);text-transform:uppercase;flex:none}
.file-meta{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:600;word-break:break-all}
.file-size{font-size:11px;color:var(--muted)}
.file-tile button{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.file-tile button:hover{background:var(--hover);color:var(--text)}
.file-tile button svg{width:18px;height:18px}

/* video */
.icn{display:inline-flex}
.video-card{display:flex;flex-direction:column}
.video-bar{display:flex;align-items:center;gap:4px;padding:5px 6px;border-top:1px solid var(--line);font-size:12px;min-width:0}
.vbtn{display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.vbtn:hover{background:var(--hover)}
.vbtn svg{width:15px;height:15px}
.vtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);text-align:right;font-size:11.5px}
.vtc{display:none}
.vtime{font:12px var(--mono);color:var(--muted);padding:0 4px;white-space:nowrap}
.vscrub{flex:1;min-width:60px}
.card.theater .vtc{display:flex}
.card.theater .vtitle{display:none}
.card.theater .video-bar{padding:8px 10px;gap:6px;flex-wrap:wrap}
.card.theater .vbtn{font-size:13px;padding:6px 10px}
.card.theater{box-shadow:0 24px 70px rgba(0,0,0,.4);outline:none!important}
.card.theater iframe{pointer-events:auto!important}
.theater-on #cards>.card:not(.theater){opacity:.07;pointer-events:none;transition:opacity .2s}
.theater-on #lines,.theater-on #inklayer,.theater-on .emptyhint{display:none}
.theater-on .card.theater>.resize,.theater-on .card.theater>.labels,.theater-on .card.theater>.reacts,.theater-on .card.theater>.caption,.theater-on .card.theater>.cmt-badge{display:none}
.video-warn{font-size:11.5px;line-height:1.45;padding:8px 10px;background:#fff4e5;color:#8a5300}
.dark .video-warn{background:#3d2e14;color:#f4c27a}
.ts-chip{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.68);color:#fff;font:600 11px var(--sans);padding:3px 8px;border-radius:10px;z-index:2}
.ts-chip:hover{background:var(--sel)}
@media (max-width:700px){.vbtn .vtl,.vbtn span:not(.icn){display:none}}

/* heading */
.card.t-heading{background:transparent;box-shadow:none}
.card.t-heading.colored{background:transparent;color:var(--cc)}
.card.t-heading.colored.dark-color{background:transparent;color:var(--cc)}
.heading-text{font:700 30px/1.2 var(--serif);padding:4px 6px;min-height:1.2em;word-break:break-word}

/* menus / popovers */
.menu,.pop{position:fixed;z-index:20000;background:var(--menu);box-shadow:var(--shadow-lg);border-radius:6px;font-size:13px;color:var(--text)}
.menu{min-width:190px;padding:5px}
.mi{display:flex;align-items:center;gap:10px;padding:5px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.mi:hover,.mi.open{background:var(--hover)}
.mi.disabled{opacity:.4;pointer-events:none}
.mi .lbl{flex:1}
.mi .kbd{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.mi .arrow{color:var(--muted)}
.mi svg{width:15px;height:15px;color:var(--muted)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu-info{display:flex;gap:8px;align-items:center;padding:6px 9px 4px;font-size:11px;color:var(--muted);line-height:1.4}
.menu-h{padding:7px 9px 3px;font-size:12px;font-weight:700}
.pop{padding:10px;min-width:180px;max-width:320px}
.pop h4{margin:0 0 8px;font-size:12px;font-weight:700}
.pop .row{display:flex;gap:6px;align-items:center;margin-top:6px}
.pop input[type=text],.pop input[type=url],.pop textarea,.pop select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:6px 8px;font-size:12.5px;outline:none}
.pop textarea{resize:vertical;min-height:60px}
.pal{display:grid;grid-template-columns:repeat(5,24px);gap:6px}
.pal button{width:24px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.15);position:relative;overflow:hidden}
.pal button.cur{box-shadow:0 0 0 2px var(--menu),0 0 0 4px var(--sel)}
.pal button.none{background:var(--card)}
.pal button.none::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#e04646;transform:rotate(-45deg)}
.pal-sep{height:1px;background:var(--line);margin:10px 0}
.custom-color{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:5px 8px;cursor:pointer;position:relative}
.custom-color input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rainbow{width:14px;height:14px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,32px);gap:4px}
.emoji-grid button{width:32px;height:32px;border-radius:5px;font-size:18px}
.emoji-grid button:hover,.emoji-grid button.cur{background:var(--hover)}
.lab-row{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer;border-radius:4px}
.lab-row:hover{background:var(--hover)}
.lab-row .dot{width:12px;height:12px;border-radius:50%}
.lab-row .ck{margin-left:auto;width:14px;color:var(--sel)}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:5px 8px;border-radius:4px;background:var(--hover);font-size:12px}
.seg button.cur{background:var(--sel);color:#fff}
.toggle{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on{background:var(--sel)}
.toggle.on::after{left:15px}

/* dropdown panels */
.dd{position:fixed;z-index:20000;background:var(--menu);box-shadow:var(--shadow-lg);border-radius:7px;font-size:13px;width:250px;padding:6px 0}
.dd-h{padding:8px 14px 4px;font-weight:700;font-size:12.5px}
.dd-sub{padding:0 14px 6px;font-size:11.5px;color:var(--muted)}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;font-size:12.5px}
.dd-item:hover{background:var(--hover)}
.dd-item svg{width:14px;height:14px;color:var(--muted)}
.dd-sep{height:1px;background:var(--line);margin:6px 0}
.dd-row{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12px}
.zoom-row{display:flex;align-items:center;gap:8px;padding:6px 14px}
.zoom-row input[type=range]{flex:1}
.zoom-row .zb{width:24px;height:24px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center}
.zoom-pct{font-size:11.5px;width:40px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:2px}
.dd .wide{display:block;margin:6px 14px;width:calc(100% - 28px);text-align:center;padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px}
.dd .wide.dark{background:var(--text);color:var(--bar);border-color:var(--text)}

/* side panels */
.side{position:fixed;right:0;top:78px;bottom:0;width:330px;max-width:100vw;z-index:15000;background:var(--menu);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;font-size:13px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.side-b{flex:1;overflow:auto;padding:10px 14px}
.side-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow .tt{flex:1;min-width:0}
.trow .tt div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tt div:last-child{font-size:11px;color:var(--muted)}
.trow .ticon{width:30px;height:30px;border-radius:4px;background:var(--hover);display:grid;place-items:center;flex:none;overflow:hidden}
.trow .ticon img{width:100%;height:100%;object-fit:cover}
.trow .ticon svg{width:16px;height:16px;color:var(--muted)}
.uitem{touch-action:none;cursor:grab}
.muted{color:var(--muted)}
.search-res{max-height:60vh;overflow:auto}
.sr{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer}
.sr:hover{background:var(--hover)}
.sr .ticon{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;flex:none;font-size:14px;background:var(--hover)}
.sr .ticon svg{width:15px;height:15px;color:var(--muted)}
.sr .tt{min-width:0;flex:1}
.sr .tt div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .tt div:last-child{font-size:11px;color:var(--muted)}
.sr-group{padding:8px 14px 2px;font-size:11px;color:var(--muted);font-weight:600}
.search-top{padding:6px 10px}
.search-top input{width:100%;border:1.5px solid var(--sel);border-radius:5px;padding:6px 9px;outline:none;background:var(--card);font-size:13px}
.search-filters{display:flex;gap:6px;padding:4px 10px 6px}
.search-filters select{border:0;background:transparent;font-size:12px;color:var(--text);cursor:pointer}

/* modal + doc editor */
.modal-bg{position:fixed;inset:0;z-index:25000;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px}
.modal{background:var(--menu);border-radius:8px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;font-size:13px}
.modal h3{margin:0 0 12px;font:600 18px var(--serif)}
.kb{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.kb kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:1px 5px;background:var(--hover)}
.docedit{position:fixed;inset:0;z-index:24000;background:var(--canvas);display:flex;flex-direction:column}
.docedit-bar{display:flex;align-items:center;gap:4px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.docedit-bar .ib{color:var(--text)}
.docedit-scroll{flex:1;overflow:auto;padding:30px 16px}
.docedit-page{max-width:760px;margin:0 auto;background:var(--card);box-shadow:var(--shadow);padding:48px 56px;min-height:80vh}
.docedit-title{font:700 30px/1.25 var(--serif);outline:none;margin-bottom:18px}
.docedit-body{outline:none;font-size:15px;line-height:1.7;min-height:50vh}
.lightbox{position:fixed;inset:0;z-index:25000;background:rgba(0,0,0,.86);display:grid;place-items:center}
.lightbox img{max-width:94vw;max-height:90vh}
.crop-stage{position:relative;display:inline-block;touch-action:none}
.crop-stage img{max-width:80vw;max-height:65vh;display:block}
.crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move}
.crop-box i{position:absolute;width:14px;height:14px;background:#fff;border-radius:2px}
.crop-box i[data-h=nw]{left:-7px;top:-7px;cursor:nwse-resize}.crop-box i[data-h=ne]{right:-7px;top:-7px;cursor:nesw-resize}
.crop-box i[data-h=sw]{left:-7px;bottom:-7px;cursor:nesw-resize}.crop-box i[data-h=se]{right:-7px;bottom:-7px;cursor:nwse-resize}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#26282b;color:#fff;font-size:13px;padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;z-index:30000;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* presentation */
.presenting #topbar,.presenting #titlebar,.presenting #toolbar,.presenting #unsortedBadge{display:none}
.presenting #viewport{background-image:none}
.presenting .card.selected{outline:none}
.present-exit{position:fixed;right:14px;top:14px;z-index:30000;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:6px 12px;border-radius:5px}

/* mobile */
@media (max-width:700px){
  #main{flex-direction:column-reverse}
  #toolbar{width:100%;height:64px;flex-direction:row;padding:4px 6px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
  .tb-sep{width:1px;height:34px;margin:0 4px}
  .tb-spacer{display:none}
  .tool{width:52px}
  .tb-back{height:40px;width:28px}
  #titlebar{grid-template-columns:auto 1fr auto;height:40px}
  #titlebar>div:first-child{display:none}
  #boardTitle{text-align:left;font-size:16px;max-width:none}
  .tbtn span.tl{display:none}
  .tbtn .ic-m{display:block}
  .side{top:auto;height:70vh;width:100%;border-radius:12px 12px 0 0}
  .docedit-page{padding:24px 18px}
  .hide-m{display:none}
}
@media print{#topbar,#titlebar,#toolbar{display:none}}

/* tasks on cards */
.todo-item{position:relative}
.todo-main{flex:1;min-width:0}
.tline{position:absolute;left:-11px;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--tc)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 3px;cursor:pointer}
.tchip{font-size:10.5px;line-height:1.6;padding:0 6px;border-radius:9px;background:var(--hover);color:var(--muted);display:inline-flex;align-items:center;gap:3px;font-weight:600;white-space:nowrap}
.tchip svg{width:11px;height:11px}
.tchip.overdue{background:#fde3e3;color:#c62828}
.tchip.today{background:#fff1d6;color:#a35f00}
.dark .tchip.overdue{background:#4a1e1e;color:#ff9a9a}
.dark .tchip.today{background:#43320f;color:#f6c46a}
.tchip.urgent{background:#e04646;color:#fff}
.tchip.important{background:#e98a2e;color:#fff}
.tchip.tag{color:#fff}
.tchip .x{color:inherit;opacity:.8;margin-left:2px;font-size:12px;line-height:1}
.topen{opacity:0;width:20px;height:20px;color:var(--muted);flex:none;border-radius:4px;display:grid;place-items:center;margin-top:1px}
.topen svg{width:13px;height:13px}
.todo-item:hover .topen{opacity:1}
.topen:hover{background:var(--hover);color:var(--text)}
@media (hover:none){.topen{opacity:.55}}
.todo-item.done .tmeta{opacity:.55}

/* task details pop-up */
.modal.tm-wrap{max-width:640px;padding:18px 20px}
.tm-head{display:flex;gap:10px;align-items:flex-start}
.chk.big{width:20px;height:20px;margin-top:5px;border-radius:4px}
.chk.on{background:var(--sel);border-color:var(--sel)}
.tm-title{flex:1;font:600 19px/1.35 var(--serif);border:0;outline:0;background:transparent;resize:none;color:var(--text);padding:2px 0;overflow:hidden}
.tm-grid{display:grid;grid-template-columns:78px 1fr;gap:10px 12px;align-items:center;margin:14px 0 6px}
.tm-label{font-size:12px;color:var(--muted);font-weight:600}
.tm-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tm-input{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:5px 8px;font-size:13px;color:var(--text);outline:none;max-width:100%}
.mini{font-size:11.5px;padding:4px 8px;border-radius:5px;background:var(--hover);font-weight:600}
.mini:hover{background:color-mix(in srgb,var(--sel) 15%,transparent)}
.flagbtn{font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1.5px solid var(--line);color:var(--muted)}
.flagbtn.important.on{background:#e98a2e;border-color:#e98a2e;color:#fff}
.flagbtn.urgent.on{background:#e04646;border-color:#e04646;color:#fff}
.tm-colors{display:flex;flex-wrap:wrap;gap:5px}
.tm-colors .sw{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15);position:relative;overflow:hidden;background:var(--card)}
.tm-colors .sw.none::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#e04646;transform:rotate(-45deg)}
.tm-colors .sw.cur{box-shadow:0 0 0 2px var(--menu),0 0 0 4px var(--sel)}
.tm-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tm-tags .tchip{font-size:11.5px;padding:2px 8px}
.tm-tagwrap{position:relative}
.tm-taginput{border:0;outline:0;background:transparent;font-size:13px;min-width:110px;padding:3px 2px;color:var(--text)}
.tm-sug{position:absolute;left:0;top:100%;z-index:5;background:var(--menu);box-shadow:var(--shadow-lg);border-radius:6px;padding:4px;min-width:180px;display:none}
.tm-sug .sug{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12.5px}
.tm-sug .sug:hover{background:var(--hover)}
.tm-sug .dot{width:10px;height:10px;border-radius:50%}
.tm-sec{margin-top:16px}
.tm-sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.st-row{display:flex;gap:8px;align-items:center;padding:3px 0}
.st-row.moving{opacity:.6}
.st-row .chk{margin-top:0}
.st-row input{flex:1;border:0;background:transparent;outline:none;font-size:13.5px;color:var(--text);padding:3px 0}
.st-row.done input{text-decoration:line-through;color:var(--muted)}
.st-row .x,.tm-tags .x{color:var(--muted);font-size:15px;width:18px}
.st-handle{cursor:grab;color:var(--muted);touch-action:none;width:14px;display:grid;place-items:center;opacity:.6}
.st-handle svg{width:14px;transform:rotate(90deg)}
.st-add{width:100%;border:1px dashed var(--line);border-radius:5px;padding:6px 9px;background:transparent;outline:none;font-size:13px;margin-top:4px;color:var(--text)}
.tm-fbar{display:flex;gap:2px;margin-bottom:4px}
.tm-fbar .ib{width:28px;height:26px;color:var(--text)}
.tm-fbar .ib svg{width:15px;height:15px}
.tm-notes{border:1px solid var(--line);border-radius:6px;min-height:110px;max-height:40vh;overflow:auto;padding:10px 12px;outline:none;font-size:14px;line-height:1.6;background:var(--card)}
.tm-notes:focus{border-color:var(--sel)}
.tm-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;font-size:12px}
.btn.danger-ghost{background:transparent;color:#e04646;border:1px solid color-mix(in srgb,#e04646 40%,transparent)}

/* tasks dashboard */
#btnTasks{gap:5px;font-weight:600}
#btnTasks .ic-t svg{width:16px;height:16px;display:block}
.tasksview{position:fixed;inset:0;z-index:23000;background:var(--canvas);display:flex;flex-direction:column}
.tv-top{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.tv-head{display:flex;align-items:center;gap:12px;padding:8px 14px}
.tv-head h2{margin:0;font:600 20px var(--serif);flex:1;display:flex;align-items:baseline;gap:10px}
.tv-count{font:500 12px var(--sans);color:var(--muted)}
.tv-head-r{display:flex;gap:8px;align-items:center}
.tv-seg button{padding:5px 12px}
.tv-filters{display:flex;gap:8px;align-items:center;padding:0 14px 10px;flex-wrap:wrap}
.tv-search{flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;color:var(--text)}
.tv-search:focus{border-color:var(--sel)}
.tv-sel{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px;font-size:12.5px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center}
.tv-done{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none}
.tv-body{flex:1;overflow:auto;padding:14px}
.tv-body.mode-board{display:flex;flex-direction:column;overflow:hidden}
.tv-cols{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;flex:1;padding-bottom:10px}
.tv-col{flex:0 0 300px;background:var(--colbody);border-radius:8px;max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line)}
.tv-colhead{display:grid;grid-template-columns:1fr auto;padding:10px 10px 6px 12px;border-radius:8px 8px 0 0;background:var(--card)}
.tv-colhead .ib{grid-row:1/3;grid-column:2;width:26px;height:26px}
.tv-colhead .ib svg{width:14px;height:14px}
.tv-coltitle{font:600 15px var(--serif)}
.tv-colsub{font-size:11px;color:var(--muted)}
.tv-col .tv-rows{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:40px;flex:1}
.tv-add{margin:0 8px 8px;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:7px 10px;font-size:13px;outline:none;color:var(--text)}
.tv-add:focus{border-style:solid;border-color:var(--sel);background:var(--card)}
.tv-row{position:relative;display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:6px;padding:9px 10px 8px 12px;box-shadow:var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.tv-row:hover{box-shadow:0 0 0 1.5px var(--sel)}
.tv-row .tline{left:4px;top:7px;bottom:7px}
.tv-row .chk{margin-top:3px}
.tv-row.done .tv-text{text-decoration:line-through;color:var(--muted)}
.tv-main{flex:1;min-width:0}
.tv-text{font-size:13.5px;line-height:1.45;word-break:break-word}
.tv-where{font-size:10.5px;color:var(--muted);align-self:center}
.tv-handle{position:absolute;right:4px;top:6px;width:16px;height:16px;color:var(--muted);opacity:0;touch-action:none;cursor:grab}
.tv-handle svg{width:14px;transform:rotate(90deg)}
.tv-row:hover .tv-handle{opacity:.6}
@media (hover:none){.tv-handle{opacity:.6}}
.tv-dragging{opacity:.35}
.tv-ghost{position:fixed;z-index:30000;pointer-events:none;box-shadow:var(--shadow-lg);transform:rotate(1.5deg);opacity:.95}
.tv-ind{height:3px;background:var(--sel);border-radius:2px;margin:-2px 0}
.tv-body.mode-list{max-width:900px;margin:0 auto;width:100%}
.tv-group{margin-bottom:18px}
.tv-ghead{padding:4px 2px 6px;font-size:13px}
.tv-group .tv-rows{display:flex;flex-direction:column;gap:6px;min-height:20px}
.tv-group .tv-add{margin:6px 0 0;width:100%}
.tv-empty{margin:60px auto;text-align:center;color:var(--muted);line-height:1.7;max-width:360px}
.tv-empty b{display:block;color:var(--text);font:600 18px var(--serif)}
.tv-hint{font-size:12px;text-align:center;margin-top:10px}
@media (max-width:700px){
  .tv-head{flex-wrap:wrap}
  .tv-head h2{font-size:18px}
  .tv-filters{flex-wrap:nowrap;overflow-x:auto}
  .tv-search{min-width:150px}
  .tv-col{flex-basis:85vw}
  .tv-cols{scroll-snap-type:x mandatory}
  .tv-col{scroll-snap-align:start}
  .tm-grid{grid-template-columns:1fr}
  .tm-label{margin-top:4px}
  #btnTasks .tl{display:none}
}

<body class="app-root">
<div id="app">
  <header id="topbar">
    <div class="crumbs" id="crumbs"></div>
    <div class="top-actions">
      <button class="tbtn" id="btnTasks" title="All tasks"></button>
      <button class="ib" id="btnUndo" title="Undo (Ctrl/⌘ Z)"></button>
      <button class="ib" id="btnRedo" title="Redo (Shift Ctrl/⌘ Z)"></button>
      <button class="ib hide-m" id="btnHelp" title="Keyboard shortcuts"></button>
      <button class="ib" id="btnSearch" title="Search"></button>
      <button class="ib" id="btnSettings" title="Settings"></button>
    </div>
  </header>
  <div id="titlebar">

  },
  req(store, mode, fn) {

      catch (e) { rej(e); }
    });
  },

  put: (s, k, v) => DB.req(s, 'readwrite', o => o.put(v, k)),

/* history + persistence */
function snapshot() { return JSON.stringify(ST); }
function checkpoint() { S.hist.push(snapshot()); if (S.hist.length > 200) S.hist.shift(); S.fut = []; updateUndoUI(); }

let saveT, saveFailed = false;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await DB.put('kv', 'state', JSON.parse(snapshot())); }
    catch (e) { if (!saveFailed) { saveFailed = true; toast('Browser storage unavailable — use Settings → Export backup'); } console.warn(e); }
    try { localStorage.setItem('corkboard-mirror', '1'); } catch { }

}

function linesOf(bid) { return Object.values(ST.lines).filter(l => l.boardId === bid); }

function minZ(bid) { let m = 1; for (const c of cardsOf(bid, true)) m = Math.min(m, c.z || 0); return m; }
function newBoard(title, parentId) { const id = uid(); ST.boards[id] = { id, title: title || 'New Board', parentId: parentId ?? S.boardId, color: BOARD_COLORS[Object.keys(ST.boards).length % BOARD_COLORS.length], icon: '', bg: null, grid: true, createdAt: now(), updatedAt: now(), view: { x: 60, y: 40, z: 1 } }; return ST.boards[id]; }
function newCard(type, x, y, data, extra) {

function boardPath(bid) { const p = []; let b = ST.boards[bid]; const seen = new Set(); while (b && !seen.has(b.id)) { seen.add(b.id); p.unshift(b); b = ST.boards[b.parentId]; } return p; }

function cardText(c) {

    case 'note': return strip(d.html);
    case 'link': return [d.title, d.url, d.desc].filter(Boolean).join(' — ');
    case 'todo': return [d.title, ...d.items.map(i => (i.done ? '[x] ' : '[ ] ') + i.text + ((i.subtasks || []).length ? ' ' + i.subtasks.map(s => s.text).join(' ') : '') + (i.notes ? ' ' + strip(i.notes) : '') + ((i.tags || []).length ? ' ' + i.tags.map(id => (ST.labels.find(l => l.id === id) || {}).name || '').join(' ') : ''))].filter(Boolean).join('\n');

    case 'column': return d.title;
    case 'comment': return d.thread.map(m => m.text).join('\n');

function applyView() {

  const g = 20 * v.z;

function renderBoard() {
  const cont = $('#cards');
  ro.disconnect();
  const keep = new Map();
  for (const el of [...cont.children]) { const c = ST.cards[el.dataset.id]; if (c && c.boardId === S.boardId && el.querySelector('.media-keep')) keep.set(el.dataset.id, el); else el.remove(); }
  applyView();

function rerenderCard(id) {

function patchCard(old, fresh) {
  const om = old.querySelector('.media-keep'), fm = fresh.querySelector('.media-keep');

  const ow = om.parentElement, fw = fm.parentElement;
  old.className = fresh.className; old.setAttribute('style', fresh.getAttribute('style') || '');
  for (const ch of [...old.children]) if (ch !== ow) ch.remove();

function renderCard(c, inCol) {

function onDbl(e) {

function bind() {
